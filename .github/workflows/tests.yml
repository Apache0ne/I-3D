name: I-3D CPU math checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  axes-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all I-3D scripts (catch installer syntax errors)
        run: python -m compileall -q scripts i3d
      - run: pip install numpy
      - run: python -m unittest discover -s tests -v
